version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # stellar-xdr and soroban-env-host move in lockstep with the protocol
    # (see Cargo.toml); bump their major versions by hand.
    ignore:
      - dependency-name: stellar-xdr
        update-types: [version-update:semver-major]
      - dependency-name: soroban-env-host
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
