version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # The embedded hosts and their stellar-xdr are pinned exactly, one host
    # per protocol; they change only with a protocol upgrade (CONTRIBUTING.md,
    # "Protocol upgrades").
    ignore:
      - dependency-name: stellar-xdr
      - dependency-name: soroban-env-host
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The `@stable` / `@1.89` ref is a toolchain choice, not an action
      # version; 1.89 must match `rust-version` in Cargo.toml.
      - dependency-name: dtolnay/rust-toolchain
      # release.yml is generated by cargo-dist and its `plan` job rejects hand
      # edits; these move when `cargo-dist-version` is bumped. Keep ci.yml on
      # the same versions by hand.
      - dependency-name: actions/checkout
      - dependency-name: actions/upload-artifact
      - dependency-name: actions/download-artifact
