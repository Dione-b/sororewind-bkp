version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # The embedded hosts and their stellar-xdr are pinned exactly, one host
    # per protocol; they change only with a protocol upgrade (CONTRIBUTING.md,
    # "Protocol upgrades").
    ignore:
      - dependency-name: stellar-xdr
      - dependency-name: soroban-env-host
      # Kept on the version the hosts and stellar-xdr use, so it is built once.
      - dependency-name: sha2
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # release.yml is generated by cargo-dist (with one hand edit, see
      # dist-workspace.toml); these move when `cargo-dist-version` is bumped. ci.yml and
      # checks.yml pin every action by commit SHA; dependabot updates the
      # others there, and their actions/checkout follows release.yml by hand.
      - dependency-name: actions/checkout
      - dependency-name: actions/upload-artifact
      - dependency-name: actions/download-artifact
