# The checks a commit has to pass: formatting, lints, the offline tests on
# every platform a release is built for, and the minimum supported Rust.
#
# Reusable, so that the same jobs gate both pull requests (ci.yml) and
# releases (release.yml, through dist's `plan-jobs`).
name: Checks

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Every job is skipped when release.yml calls this for a pull request: dist
# runs its plan on pull requests too, and ci.yml already runs these there.
jobs:
  fmt:
    if: github.workflow != 'Release' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    if: github.workflow != 'Release' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    if: github.workflow != 'Release' || github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked

  # A snapshot no test asserts, or one waiting for review, is drift nobody
  # is looking at.
  snapshots:
    if: github.workflow != 'Release' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-insta
      # No `--locked`: cargo-insta has no such flag and hands anything after
      # `--` to the test binaries. The other jobs check the lockfile.
      - run: cargo insta test --check --unreferenced=reject

  # The API docs are part of the contributor documentation: broken intra-doc
  # links and malformed docs fail the build.
  docs:
    if: github.workflow != 'Release' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --no-deps --locked

  # Keeps the `rust-version` in Cargo.toml honest. That line is the only
  # place the version is written; this job reads it from there.
  msrv:
    if: github.workflow != 'Release' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml for every later cargo
      # and rustup call in the job, so the pinned toolchain is neither
      # installed nor used here.
      - run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$msrv"
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --locked --all-targets
