name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Nightly: the live-RPC replay check and the advisory database. The rest
    # only changes when the code does.
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting, lints, tests, snapshots, docs and MSRV; see checks.yml.
  checks:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/checks.yml

  # Advisories, licences, banned crates and sources; see deny.toml. Nightly
  # too: an advisory can be published against an unchanged lockfile.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # Replays recent failed testnet transactions against the live RPC. Not run
  # on push or PR, so an RPC outage cannot fail unrelated changes.
  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Optimised: the test times each replay, and the hosts interpret WASM.
      - run: cargo test --release --locked --test live -- --ignored --nocapture

  # A scheduled run has no author to notify, so a failure opens an issue (or
  # comments on the one already open): a network moving past the embedded
  # protocols must not go unnoticed.
  report-nightly-failure:
    if: ${{ always() && github.event_name == 'schedule' && (needs.live.result == 'failure' || needs.deny.result == 'failure') }}
    needs: [live, deny]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Nightly CI is failing
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BODY: |
        The scheduled CI run failed (live: ${{ needs.live.result }}, deny: ${{ needs.deny.result }}).

        If the live job failed on `no_network_is_ahead_of_the_embedded_hosts`, a network has
        upgraded its protocol: see CONTRIBUTING.md, "Protocol upgrades".
    steps:
      - run: |
          existing=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "$BODY

          Run: $RUN_URL"
          fi
