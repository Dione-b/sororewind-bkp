[package]
name = "sororewind"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Replay a failed Soroban transaction locally and narrate the call tree to the point of failure"
license = "Apache-2.0"
repository = "https://github.com/Dione-b/sororewind"
homepage = "https://github.com/Dione-b/sororewind"
readme = "README.md"
keywords = ["stellar", "soroban", "debugging", "replay", "blockchain"]
categories = ["command-line-utilities", "development-tools::debugging"]
exclude = ["fixtures/", "tests/", ".github/"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# Protocol lockstep: these two move together, and their major version is the
# Stellar protocol version this build can replay. See CONTRIBUTING.md.
stellar-xdr = { version = "30.0.0" }
soroban-env-host = { version = "30.0.0" }
owo-colors = "4"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
stellar-strkey = "1.0"
sha2 = "0.10"

[dev-dependencies]
insta = "1.49"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
too_many_arguments = "warn"
needless_pass_by_value = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
