[package]
name = "sororewind"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Replay a failed Soroban transaction locally and narrate the call tree to the point of failure"
license = "Apache-2.0"
repository = "https://github.com/Dione-b/sororewind"
homepage = "https://github.com/Dione-b/sororewind"
readme = "README.md"
keywords = ["stellar", "soroban", "debugging", "replay", "blockchain"]
categories = ["command-line-utilities", "development-tools::debugging"]
exclude = ["fixtures/", "tests/", ".github/"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# One Soroban host per protocol this build replays, at most two at a time
# (the previous and the current one). Each host's major version is the
# protocol it executes; pin them exactly, as stellar-core does. `stellar-xdr`
# follows the newest host: the code outside `src/host/` uses only its types,
# and talks to older hosts in XDR bytes. See CONTRIBUTING.md, "Protocol
# upgrades".
stellar-xdr = { version = "=30.0.0" }
soroban-env-host-p29 = { package = "soroban-env-host", version = "=29.0.2" }
soroban-env-host-p30 = { package = "soroban-env-host", version = "=30.0.0" }
owo-colors = "4"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# reqwest already pulls 0.23 in; the hosts use 0.22 for their XDR.
base64 = "0.23"
hex = "0.4"
stellar-strkey = "1.0"
# The version the hosts and stellar-xdr hash with, so it is built once.
sha2 = "0.10"

[dev-dependencies]
insta = "1.49"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
too_many_arguments = "warn"
needless_pass_by_value = "warn"
# Only `src/main.rs` writes to the terminal; the library returns what to print.
print_stdout = "warn"
print_stderr = "warn"

# What `cargo install` builds: thin LTO keeps a source install of two
# embedded hosts quick.
[profile.release]
lto = "thin"
strip = true

# The profile that 'dist' will build with: the published binaries are built
# once per release, so they get the full optimisation.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
