# cargo-deny configuration, checked in CI by the `deny` job.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Only direct dependencies fail the build for being unmaintained.
unmaintained = "workspace"
ignore = [
    # Timing side channels in elliptic-curve, pulled in by soroban-env-host 30.
    # The replay only verifies public signatures and never handles secret
    # keys; the fix arrives with the next protocol-lockstep host bump.
    { id = "RUSTSEC-2026-0387", reason = "no secret-key operations; fixed by the next soroban-env-host bump" },
]

[licenses]
# Permissive licences only; the project itself is Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Two embedded hosts (one per protocol) bring two of most of their
# dependency tree; those duplicates are expected and skipped. Anything else
# built twice is worth a look.
multiple-versions = "warn"
skip-tree = [
    { crate = "soroban-env-host@29.0.2", reason = "the previous protocol's host, embedded on purpose" },
    { crate = "soroban-env-host@30.0.0", reason = "the current protocol's host, embedded on purpose" },
]
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
