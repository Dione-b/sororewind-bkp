[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Where to host releases
hosting = "github"
# Nothing is built or published unless the checks every pull request has to
# pass (.github/workflows/checks.yml) pass on the tagged commit.
plan-jobs = ["./checks"]
# dist sets `contents: write` for the whole release workflow; the checks only
# read.
github-custom-job-permissions = { "checks" = { contents = "read" } }
# release.yml carries one hand edit that dist cannot generate: `host` (which
# publishes) also requires the checks to have passed. See the comment there;
# tests/release.rs checks the edit is still in place.
allow-dirty = ["ci"]
